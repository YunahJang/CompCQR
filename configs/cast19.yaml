# ─────────────────────────────────────────────────────────────────────────
#  TREC CAsT-19 (queries only: no system responses in the history)
# ─────────────────────────────────────────────────────────────────────────
dataset: cast19
split: test
schema: cast19
id_prefix_strip: null

paths:
  input_file:    datasets/cast19/test.jsonl
  qrel_file:     datasets/cast19/qrels.tsv
  collection_h5: datasets/cast_shared/collections/data.h5
  demonstrations: prompts/demonstrations.json
  work_dir:      work/cast19
  output_dir:    output/cast19

variations:
  components: [oq, mq, ma, mq2, ma2]
  max_k: 5
  joiner: "+"

fusion:
  rrf_k: 0
  top_n: 100

selection:
  history_turns: 4

default_retriever: ance

retrievers:
  ance:
    type: dense
    encoder: sentence-transformers/msmarco-roberta-base-ance-firstp
    dim: 768
    index_dir: indexes/cast_shared/ance
    index_splits: 10
    normalize: false
