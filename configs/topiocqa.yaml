# ─────────────────────────────────────────────────────────────────────────
#  TopiOCQA (dev)
#  Paths are relative to the repository root unless they start with "/".
#  All of them are produced by the preprocessing of prior work — see README.
# ─────────────────────────────────────────────────────────────────────────
dataset: topiocqa
split: dev
schema: topiocqa          # field layout of input_file (see compcqr/data.py)
id_prefix_strip: null     # optional prefix to drop from sample ids

paths:
  input_file:    datasets/topiocqa/dev_new.json
  qrel_file:     datasets/topiocqa/dev_gold.trec
  collection_h5: datasets/topiocqa/collections/data.h5
  demonstrations: prompts/demonstrations.json
  work_dir:      work/topiocqa          # cached intermediates (steps 0-4)
  output_dir:    output/topiocqa        # selections, run file, metrics

variations:
  components: [oq, mq, ma, mq2, ma2]
  max_k: 5                # ordered subsets of size 1..5 -> 325 variations
  joiner: "+"             # how component texts are concatenated

fusion:
  rrf_k: 0                # RRF(d) = sum 1/(k + rank); k=0 rewards top-1 consensus
  top_n: 100              # ranks per variation considered by the fusion

selection:
  history_turns: 4        # dialogue turns shown to the selector

default_retriever: ance

retrievers:
  ance:
    type: dense
    encoder: sentence-transformers/msmarco-roberta-base-ance-firstp
    dim: 768
    index_dir: indexes/topiocqa/ance
    index_splits: 10
    normalize: false

  bm25:
    type: bm25
    index_dir: indexes/topiocqa/bm25
    k1: 0.9
    b: 0.4
